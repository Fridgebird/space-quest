<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship's Computer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #05060f; --bg2: #1a1145; --cyan: #5ee7ff; --violet: #9b5cff; --red: #ff4d5e; --green: #4be3a0;
    --panel: #151a3a; --panel-2: #1d2350; --text: #eef4ff; --muted: #a3acd0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Exo 2", system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(ellipse at 15% 10%, rgba(155,92,255,.35), transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(94,231,255,.18), transparent 50%),
      linear-gradient(var(--bg2), var(--bg1) 70%);
    background-attachment: fixed;
    min-height: 100vh; overflow-x: hidden;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }

  h1, h2, .display { font-family: "Orbitron", sans-serif; }
  .btn {
    font: inherit; font-weight: 700; font-size: 1.2rem; padding: 14px 36px; border: 0; border-radius: 999px;
    cursor: pointer; background: var(--violet); color: #fff; box-shadow: 0 5px 0 #5a2ca8;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a2ca8; }

  /* Log-on */
  #logon { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px 16px; text-align: center; }
  #logon h1 { color: var(--cyan); font-size: clamp(1.6rem, 6vw, 3rem); margin: 0; text-shadow: 0 0 22px rgba(94,231,255,.6); }
  #logon p { color: var(--muted); font-size: 1.2rem; margin: 0; }

  /* Console layout: sidebar on tablets, tabs along the top on phones */
  #console { position: relative; z-index: 1; display: grid; grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid rgba(94,231,255,.3); background: rgba(5,6,15,.55); }
  header .ship { font-family: "Orbitron", sans-serif; color: var(--cyan); font-size: 1.15rem; }
  header .sub { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  nav { display: flex; flex-direction: column; gap: 8px; padding: 16px 12px; border-right: 1px solid rgba(94,231,255,.2); background: rgba(5,6,15,.35); }
  nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; width: 100%;
    font: inherit; font-weight: 700; font-size: 1.05rem; text-align: left; color: var(--text);
    padding: 10px 14px; border-radius: 12px; border: 1px solid transparent; background: none; cursor: pointer;
  }
  nav button.active { background: var(--panel-2); border-color: var(--cyan); color: var(--cyan); }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px;
    border-radius: 999px; background: var(--red); color: #fff; font-size: .95rem; box-shadow: 0 0 12px rgba(255,77,94,.8);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 2px rgba(255,77,94,.3); } }
  main { padding: 20px; min-width: 0; max-width: 900px; width: 100%; }
  main h2 { color: var(--cyan); font-size: 1.4rem; margin: 0 0 16px; }

  @media (max-width: 700px) {
    #console { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; }
    header { padding: 12px 16px; }
    nav { flex-direction: row; gap: 4px; padding: 8px; border-right: 0; border-bottom: 1px solid rgba(94,231,255,.2); }
    nav button { flex: 1 1 0; flex-direction: column; justify-content: center; text-align: center; font-size: .8rem; padding: 6px 4px; position: relative; min-width: 0; }
    nav .badge { position: absolute; top: 2px; right: 2px; min-width: 22px; height: 22px; padding: 0 5px; font-size: .8rem; }
    main { padding: 16px; }
  }

  /* Messages */
  .card { background: rgba(21,26,58,.8); border: 1px solid rgba(94,231,255,.35); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .msg-head { color: var(--muted); font-size: .9rem; margin-bottom: 4px; }
  .msg-subject { font-weight: 700; font-size: 1.25rem; margin-bottom: 12px; }
  .msg-body p { font-size: 1.15rem; line-height: 1.6; margin: 0 0 12px; min-height: 1.6em; }
  .caret::after { content: "▌"; color: var(--cyan); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .link-btn { font: inherit; font-weight: 700; color: var(--cyan); background: none; border: 1px solid var(--cyan); border-radius: 999px; padding: 10px 22px; cursor: pointer; }

  /* Crew + ship */
  .rows { width: 100%; border-collapse: collapse; }
  .rows th, .rows td { text-align: left; padding: 14px 12px; border-bottom: 1px solid rgba(94,231,255,.15); font-size: 1.1rem; overflow-wrap: anywhere; }
  .rows tr:last-child th, .rows tr:last-child td { border-bottom: 0; }
  .rows th { color: var(--muted); font-weight: 400; width: 40%; }

  /* Alerts */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 480px) { .grid { gap: 10px; } }
  .tile {
    position: relative; min-height: 130px; aspect-ratio: 1; border-radius: 16px; border: 2px solid var(--red);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; color: inherit; padding: 8px; cursor: pointer; background: #2d1230;
    box-shadow: 0 0 16px rgba(255,77,94,.45);
  }
  .tile .sym { font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1; }
  .tile .name { margin-top: 8px; font-weight: 700; font-size: clamp(.8rem, 2.4vw, 1.05rem); text-align: center; overflow-wrap: anywhere; }
  .tile .tag { margin-top: 4px; font-size: .72rem; color: var(--red); letter-spacing: .08em; }
  .tile.cleared { background: var(--panel); border-color: var(--green); box-shadow: none; }
  .tile.cleared .tag { color: var(--green); }
  .tile.just { animation: pop 1.2s ease; }
  @keyframes pop {
    0% { transform: scale(1); } 30% { transform: scale(1.14) rotate(-3deg); }
    60% { transform: scale(.97) rotate(2deg); } 100% { transform: scale(1); }
  }
  .warp-wrap { margin-top: 24px; text-align: center; }
  #warpBtn {
    width: 100%; min-height: 72px; font-family: "Orbitron", sans-serif; font-size: 1.3rem; border-radius: 16px; border: 2px solid #3a4170;
    background: #1a1e40; color: var(--muted); cursor: not-allowed;
  }
  #warpBtn:not(:disabled) { cursor: pointer; color: #04121a; background: linear-gradient(90deg, var(--cyan), #b89cff); border-color: #fff; animation: ready 1.2s ease-in-out infinite; }
  @keyframes ready { 50% { box-shadow: 0 0 34px rgba(94,231,255,.9); } }

  /* Alert detail */
  .modal { position: fixed; inset: 0; background: rgba(2,3,12,.78); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal .box { background: var(--panel); border-radius: 20px; padding: 24px; max-width: 520px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; text-align: center; border: 2px solid var(--red); }
  .modal .box.cleared { border-color: var(--green); }
  .modal .sym { font-size: 3.6rem; }
  .modal h2 { font-size: 1.5rem; margin: 6px 0 4px; color: var(--text); }
  .modal .state { font-weight: 700; letter-spacing: .08em; font-size: .85rem; color: var(--red); margin-bottom: 12px; }
  .box.cleared .state { color: var(--green); }
  .modal .content { font-size: 1.2rem; line-height: 1.5; }
  #codeForm { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #codeInput {
    flex: 1 1 180px; min-width: 0; font-family: "Orbitron", sans-serif; font-size: 1.2rem; text-align: center; padding: 12px; border-radius: 12px;
    border: 2px solid var(--cyan); background: #0a0d24; color: var(--text);
  }
  #codeForm .btn { box-shadow: none; padding: 12px 24px; }
  #codeError { color: var(--red); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #mClose { margin-top: 14px; }

  /* Wiring puzzle */
  .modal .box.wide { max-width: 640px; }
  #wireSvg { width: 100%; height: auto; max-height: 55vh; display: block; margin: 12px auto 0; touch-action: manipulation; }
  .term { cursor: pointer; }
  .term .hit { fill: transparent; }
  .term .post { fill: #0a0d24; stroke: var(--cyan); stroke-width: 3; }
  .term.sel .post { fill: var(--cyan); animation: selpulse .8s ease-in-out infinite alternate; }
  @keyframes selpulse { to { fill: #0a0d24; } }
  .term text { fill: var(--text); font-family: "Orbitron", sans-serif; font-size: 20px; dominant-baseline: central; }
  .box.cleared .term { cursor: default; }
  .box.cleared .term .post { stroke: var(--green); }
  .wire { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
  .wire.powered { filter: drop-shadow(0 0 5px currentColor); }
  .wire-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
  .wire-actions .btn { box-shadow: none; padding: 12px 28px; }

  /* Ending */
  #ending { position: fixed; inset: 0; z-index: 20; background: #000; }
  #warpCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .end-text { position: absolute; left: 16px; right: 16px; text-align: center; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  .end-text.show { opacity: 1; }
  #engaging { top: 45%; font-family: "Orbitron", sans-serif; color: var(--cyan); font-size: clamp(1.1rem, 4vw, 2rem); }
  #endFinal { bottom: 7%; }
  #endFinal h2 { color: var(--cyan); font-size: clamp(1.4rem, 5vw, 2.6rem); margin: 0 0 8px; text-shadow: 0 0 18px rgba(94,231,255,.7); }
  #endFinal p { font-size: clamp(1.05rem, 3vw, 1.5rem); margin: 0; text-shadow: 0 1px 6px #000; }

  .status { position: fixed; bottom: 8px; right: 12px; font-size: .75rem; opacity: .65; z-index: 2; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<section id="logon">
  <h1 id="logonShip"></h1>
  <p>Stasis cycle interrupted</p>
  <button class="btn" id="logonBtn">Log on</button>
</section>

<div id="console" hidden>
  <header>
    <div class="ship" id="headerShip"></div>
    <div class="sub">Ship's Computer</div>
  </header>
  <nav>
    <button data-view="messages">Messages</button>
    <button data-view="crew">Crew Manifest</button>
    <button data-view="ship">About the Ship</button>
    <button data-view="alerts">Alerts <span class="badge" id="badge" aria-label="active alerts" hidden></span></button>
  </nav>
  <main>
    <section id="view-messages" hidden>
      <h2>Messages</h2>
      <div id="messageList"></div>
    </section>
    <section id="view-crew" hidden>
      <h2>Crew Manifest</h2>
      <div class="card"><table class="rows"><tbody id="crewRows"></tbody></table></div>
    </section>
    <section id="view-ship" hidden>
      <h2>About the Ship</h2>
      <div class="card"><table class="rows"><tbody id="shipRows"></tbody></table></div>
    </section>
    <section id="view-alerts" hidden>
      <h2>Alerts</h2>
      <div class="grid" id="grid"></div>
      <div class="warp-wrap"><button id="warpBtn" disabled></button></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" id="mBox">
    <div class="sym" id="mSym"></div>
    <h2 id="mTitle"></h2>
    <div class="state" id="mState"></div>
    <div class="content" id="mContent"></div>
    <form id="codeForm" autocomplete="off" hidden>
      <input id="codeInput" aria-label="Enter code" placeholder="Enter code" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="btn" type="submit">Submit</button>
    </form>
    <div id="wirePanel" hidden>
      <svg id="wireSvg" role="group" aria-label="Wiring panel"></svg>
      <div class="wire-actions" id="wireActions">
        <button class="link-btn" id="wireReset">Disconnect all</button>
        <button class="btn" id="wirePower">Power on</button>
      </div>
    </div>
    <div id="codeError" role="alert"></div>
    <button class="btn" id="mClose">Close</button>
  </div>
</div>

<div id="ending" hidden>
  <canvas id="warpCanvas"></canvas>
  <div class="end-text" id="engaging">ENGAGING WARP DRIVE</div>
  <div class="end-text" id="endFinal"><h2 id="endTitle"></h2><p id="endBody"></p></div>
</div>

<div class="status" id="status">Connecting…</div>

<script src="config.js"></script>
<script src="state.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const LOGGED_ON_KEY = "quest-logged-on:" + GAME_ID;
  const RESET_KEY = "quest-reset:" + GAME_ID;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cleared = {};
  let warped = false;
  let firstLoad = true;
  let audio = null;
  let openAlert = null;
  let stopTyping = null;

  // Stars
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    const size = 1 + Math.random() * 2.5;
    s.className = "star";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.width = s.style.height = size + "px";
    s.style.animationDuration = 1.5 + Math.random() * 4 + "s";
    s.style.animationDelay = -Math.random() * 5 + "s";
    $("stars").appendChild(s);
  }

  // Static screens
  $("logonShip").textContent = SHIP.name;
  $("headerShip").textContent = SHIP.name;
  $("endTitle").textContent = ENDING.title;
  $("endBody").textContent = ENDING.text;

  function fillRows(el, rows) {
    rows.forEach(([label, value]) => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      const td = document.createElement("td");
      th.textContent = label;
      td.textContent = value;
      tr.append(th, td);
      el.appendChild(tr);
    });
  }
  fillRows($("crewRows"), CREW.map((c) => [c.role, c.name]));
  fillRows($("shipRows"), [["Name", SHIP.name]].concat(SHIP.details));

  // Messages. Pass typeFirst to type out the first message.
  function renderMessages(typeFirst) {
    if (stopTyping) stopTyping();
    const list = $("messageList");
    list.innerHTML = "";
    MESSAGES.forEach((m, i) => {
      const card = document.createElement("article");
      card.className = "card";
      const head = document.createElement("div");
      head.className = "msg-head";
      head.textContent = "From: " + m.from;
      const subject = document.createElement("div");
      subject.className = "msg-subject";
      subject.textContent = m.subject;
      const body = document.createElement("div");
      body.className = "msg-body";
      const paras = m.body.map((text) => {
        const p = document.createElement("p");
        p.textContent = text;
        body.appendChild(p);
        return p;
      });
      card.append(head, subject, body);
      if (i === 0) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const toAlerts = document.createElement("button");
        toAlerts.className = "link-btn";
        toAlerts.textContent = "View alerts";
        toAlerts.addEventListener("click", () => showView("alerts"));
        actions.appendChild(toAlerts);
        if (typeFirst && !reducedMotion) typeOut(m.body, paras, actions);
        card.appendChild(actions);
      }
      list.appendChild(card);
    });
  }

  function typeOut(texts, paras, actions) {
    paras.forEach((p) => { p.textContent = ""; });
    const skip = document.createElement("button");
    skip.className = "link-btn";
    skip.textContent = "Skip";
    actions.prepend(skip);
    let pi = 0, ci = 0;
    const finish = () => {
      clearInterval(timer);
      paras.forEach((p, i) => { p.textContent = texts[i]; p.classList.remove("caret"); });
      skip.remove();
      stopTyping = null;
    };
    const timer = setInterval(() => {
      if (pi >= paras.length) return finish();
      ci++;
      paras[pi].textContent = texts[pi].slice(0, ci);
      paras[pi].classList.add("caret");
      if (ci >= texts[pi].length) {
        paras[pi].classList.remove("caret");
        pi++; ci = 0;
      }
    }, 28);
    skip.addEventListener("click", finish);
    stopTyping = finish;
  }

  // Navigation
  const navButtons = document.querySelectorAll("nav button");
  navButtons.forEach((b) => b.addEventListener("click", () => showView(b.dataset.view)));
  function showView(view) {
    navButtons.forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    ["messages", "crew", "ship", "alerts"].forEach((v) => { $("view-" + v).hidden = v !== view; });
    window.scrollTo(0, 0);
  }

  function showConsole(firstTime) {
    $("logon").hidden = true;
    $("console").hidden = false;
    renderMessages(firstTime);
    showView("messages");
  }
  function showLogon() {
    closeAlert();
    if (stopTyping) stopTyping();
    $("console").hidden = true;
    $("logon").hidden = false;
  }
  if (store.get(LOGGED_ON_KEY)) showConsole(false);
  $("logonBtn").addEventListener("click", () => {
    store.set(LOGGED_ON_KEY, "1");
    initAudio();
    showConsole(true);
  });

  // Alert tiles
  const tileEls = {};
  ALERTS.forEach((a) => {
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = '<div class="sym"></div><div class="name"></div><div class="tag"></div>';
    b.querySelector(".sym").textContent = a.symbol;
    b.querySelector(".name").textContent = a.title;
    b.addEventListener("click", () => { openAlert = a; renderAlert(true); });
    $("grid").appendChild(b);
    tileEls[a.id] = b;
  });

  function renderAlert(fresh) {
    const a = openAlert;
    if (!a) return;
    const isCleared = !!cleared[a.id];
    $("modal").hidden = false;
    $("mBox").classList.toggle("cleared", isCleared);
    $("mSym").textContent = a.symbol;
    $("mTitle").textContent = a.title;
    $("mState").textContent = isCleared ? "CLEARED" : "ALERT ACTIVE";
    $("mContent").innerHTML = isCleared ? a.clearedText : a.description;
    $("codeForm").hidden = isCleared || !a.code;
    $("mBox").classList.toggle("wide", !!a.wiring);
    if (fresh || isCleared) { $("codeError").textContent = ""; $("codeInput").value = ""; wireSelected = null; }
    renderWiring(a, isCleared);
    if (fresh && a.code && !isCleared) $("codeInput").focus();
  }

  // Wiring puzzles: tap a left terminal, then a right terminal, to connect them.
  const wiring = {}; // alertId -> { leftLabel: rightLabel }
  let wireSelected = null;
  const WIRE_COLOURS = ["#ff5d73", "#ffd166", "#4be3a0", "#5ee7ff", "#b89cff", "#ff9f43", "#f78fb3", "#a3e635"];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function renderWiring(a, isCleared) {
    $("wirePanel").hidden = !a.wiring;
    if (!a.wiring) return;
    const w = a.wiring;
    const links = isCleared ? w.solution : (wiring[a.id] = wiring[a.id] || {});
    const n = Math.max(w.left.length, w.right.length);
    const LX = 80, RX = 320, y = (i) => 36 + i * 64;
    let svg = "";
    w.left.forEach((L, i) => {
      const j = w.right.map(String).indexOf(String(links[L]));
      if (j < 0) return;
      svg += '<path class="wire' + (isCleared ? " powered" : "") + '" style="color:' + WIRE_COLOURS[i % WIRE_COLOURS.length] + '" d="M' + LX + " " + y(i) +
        " C " + (LX + 120) + " " + y(i) + ", " + (RX - 120) + " " + y(j) + ", " + RX + " " + y(j) + '"/>';
    });
    const term = (side, label, i, x) =>
      '<g class="term' + (side === "L" && wireSelected === label ? " sel" : "") + '" data-side="' + side + '" data-i="' + i + '">' +
      '<circle class="hit" cx="' + x + '" cy="' + y(i) + '" r="30"/>' +
      '<circle class="post" cx="' + x + '" cy="' + y(i) + '" r="15"/>' +
      '<text x="' + (side === "L" ? x - 28 : x + 28) + '" y="' + y(i) + '" text-anchor="' + (side === "L" ? "end" : "start") + '">' + esc(label) + "</text></g>";
    w.left.forEach((L, i) => { svg += term("L", L, i, LX); });
    w.right.forEach((R, i) => { svg += term("R", R, i, RX); });
    $("wireSvg").setAttribute("viewBox", "0 0 400 " + (n * 64 + 8));
    $("wireSvg").innerHTML = svg;
    $("wireActions").hidden = isCleared;
  }

  $("wireSvg").addEventListener("click", (e) => {
    const g = e.target.closest(".term");
    const a = openAlert;
    if (!g || !a || !a.wiring || cleared[a.id]) return;
    const links = wiring[a.id];
    const i = Number(g.dataset.i);
    if (g.dataset.side === "L") {
      const L = a.wiring.left[i];
      wireSelected = wireSelected === L ? null : L;
    } else {
      const R = a.wiring.right[i];
      // A right terminal takes one wire, so drop any wire already on it.
      for (const k in links) if (links[k] === R) delete links[k];
      if (wireSelected) links[wireSelected] = R;
      wireSelected = null;
    }
    $("codeError").textContent = "";
    renderWiring(a, false);
  });
  $("wireReset").addEventListener("click", () => {
    if (!openAlert) return;
    wiring[openAlert.id] = {};
    wireSelected = null;
    $("codeError").textContent = "";
    renderWiring(openAlert, false);
  });
  $("wirePower").addEventListener("click", () => {
    const a = openAlert;
    if (!a || !a.wiring) return;
    const links = wiring[a.id] || {};
    if (a.wiring.left.some((L) => links[L] == null)) {
      $("codeError").textContent = "Connect every terminal first.";
      return;
    }
    if (a.wiring.left.every((L) => String(links[L]) === String(a.wiring.solution[L]))) {
      GameState.setCleared(a.id, true).catch(() => {
        $("codeError").textContent = "Transmission failed. Try again.";
      });
    } else {
      $("codeError").textContent = "CIRCUIT FAULT: POWER FAILED";
      buzz();
      const p = $("wirePanel");
      p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
    }
  });
  function closeAlert() {
    openAlert = null;
    $("modal").hidden = true;
  }
  $("mClose").addEventListener("click", closeAlert);
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeAlert(); });

  const normaliseCode = (s) => String(s).replace(/\s+/g, "").toUpperCase();
  $("codeForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const a = openAlert;
    if (!a) return;
    if (normaliseCode($("codeInput").value) === normaliseCode(a.code)) {
      GameState.setCleared(a.id, true).catch(() => {
        $("codeError").textContent = "Transmission failed. Try again.";
      });
    } else {
      $("codeError").textContent = "INVALID CODE";
      const form = $("codeForm");
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
    }
  });

  // Audio needs a tap before it can play, so set it up on the first touch anywhere.
  document.addEventListener("pointerdown", initAudio, { once: true });
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function chime() {
    if (!audio) return;
    [523, 784, 1047, 1568].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      const t0 = audio.currentTime + i * 0.1;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.55);
    });
  }
  function buzz() {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime;
    o.type = "square"; o.frequency.value = 90;
    g.gain.setValueAtTime(0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.5);
  }
  function warpSound() {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime;
    o.type = "sawtooth";
    o.frequency.setValueAtTime(50, t0);
    o.frequency.exponentialRampToValueAtTime(1200, t0 + 3.2);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 2.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
    o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 3.7);
  }

  function render(newlyCleared) {
    let active = 0;
    ALERTS.forEach((a) => {
      const el = tileEls[a.id];
      const isCleared = !!cleared[a.id];
      if (!isCleared) active++;
      el.classList.toggle("cleared", isCleared);
      el.querySelector(".tag").textContent = isCleared ? "CLEARED" : "ACTIVE";
      if (newlyCleared.includes(a.id)) {
        el.classList.remove("just"); void el.offsetWidth; el.classList.add("just");
      }
    });
    $("badge").textContent = active;
    $("badge").hidden = active === 0;
    $("warpBtn").disabled = active > 0;
    $("warpBtn").textContent = active > 0
      ? "WARP OFFLINE: " + active + (active === 1 ? " ALERT ACTIVE" : " ALERTS ACTIVE")
      : "ENGAGE WARP DRIVE";
  }

  $("warpBtn").addEventListener("click", () => {
    GameState.setWarped().catch(() => {
      $("status").textContent = "⚠ Could not reach the database";
    });
  });

  // Ending: warp streaks, then Earth grows as the ship flies home.
  const WARP_END = 3.6, ARRIVAL = 5.5;
  let warpFrame = null;

  function playEnding(skipToEnd) {
    closeAlert();
    if (warpFrame) cancelAnimationFrame(warpFrame);
    $("ending").hidden = false;
    const canvas = $("warpCanvas");
    const ctx = canvas.getContext("2d");
    const size = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
    size();
    window.onresize = size;
    const stars = Array.from({ length: 320 }, () => ({
      x: (Math.random() - .5) * 2000, y: (Math.random() - .5) * 2000, z: Math.random() * 1000 + 1
    }));
    const skip = skipToEnd || reducedMotion;
    const start = performance.now() - (skip ? (WARP_END + ARRIVAL + 1) * 1000 : 0);
    let last = performance.now();
    $("engaging").classList.toggle("show", !skip);
    $("endFinal").classList.toggle("show", skip);
    if (!skip) warpSound();

    function frame(now) {
      const t = (now - start) / 1000;
      const dt = Math.min((now - last) / 1000, .05);
      last = now;
      const w = canvas.width, h = canvas.height, cx = w / 2, cy = h * .42;
      const speed = t < WARP_END ? 60 + Math.pow(t / WARP_END, 3) * 2600 : 40;
      const streak = t < WARP_END ? Math.min(speed * .05, 160) : 1;
      ctx.fillStyle = "#02030c";
      ctx.fillRect(0, 0, w, h);
      ctx.lineCap = "round";
      stars.forEach((s) => {
        s.z -= speed * dt;
        if (s.z < 1) { s.z = 1000; s.x = (Math.random() - .5) * 2000; s.y = (Math.random() - .5) * 2000; }
        const sx = cx + s.x / s.z * 300, sy = cy + s.y / s.z * 300;
        const px = cx + s.x / (s.z + streak) * 300, py = cy + s.y / (s.z + streak) * 300;
        ctx.strokeStyle = t < WARP_END ? "#bfefff" : "#ffffff";
        ctx.lineWidth = t < WARP_END ? 1.6 : 1.3;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx + .1, sy); ctx.stroke();
      });
      if (t >= WARP_END - .4 && $("engaging").classList.contains("show")) $("engaging").classList.remove("show");
      if (t >= WARP_END) {
        const e = Math.min((t - WARP_END) / ARRIVAL, 1);
        drawEarth(ctx, cx, cy, Math.min(w, h) * (.02 + .3 * (1 - Math.pow(1 - e, 3))));
        if (e < 1) drawShip(ctx, cx, h * .95 + (cy - h * .95) * e, 70 * (1 - e) + 3);
        if (e >= 1) $("endFinal").classList.add("show");
      }
      const flash = 1 - Math.abs(t - WARP_END) / .35;
      if (flash > 0) {
        ctx.fillStyle = "rgba(255,255,255," + flash + ")";
        ctx.fillRect(0, 0, w, h);
      }
      warpFrame = requestAnimationFrame(frame);
    }
    warpFrame = requestAnimationFrame(frame);
  }

  function drawEarth(ctx, x, y, r) {
    const glow = ctx.createRadialGradient(x, y, r * .9, x, y, r * 1.3);
    glow.addColorStop(0, "rgba(94,190,255,.55)");
    glow.addColorStop(1, "rgba(94,190,255,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, r * 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    const sea = ctx.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
    sea.addColorStop(0, "#4aa8ff");
    sea.addColorStop(1, "#0b3a8c");
    ctx.fillStyle = sea;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = "#3fa35c";
    [[-.35, -.3, .4, .28], [.3, .1, .32, .42], [-.3, .4, .28, .2], [.45, -.5, .22, .14]].forEach(([dx, dy, rx, ry]) => {
      ctx.beginPath(); ctx.ellipse(x + dx * r, y + dy * r, rx * r, ry * r, .5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#f4fbff";
    ctx.beginPath(); ctx.ellipse(x, y - r * .97, r * .5, r * .13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawShip(ctx, x, y, size) {
    ctx.fillStyle = "#ffb347";
    ctx.beginPath(); ctx.ellipse(x, y + size * .62, size * .14, size * .34, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#dfe7ff";
    ctx.beginPath();
    ctx.moveTo(x, y - size * .6);
    ctx.lineTo(x + size * .42, y + size * .5);
    ctx.lineTo(x, y + size * .3);
    ctx.lineTo(x - size * .42, y + size * .5);
    ctx.closePath(); ctx.fill();
  }

  function hideEnding() {
    if (warpFrame) cancelAnimationFrame(warpFrame);
    warpFrame = null;
    window.onresize = null;
    $("ending").hidden = true;
  }

  GameState.subscribe((state) => {
    const fresh = Object.keys(state.cleared).filter((id) => state.cleared[id] && !cleared[id]);
    cleared = state.cleared;
    render(firstLoad ? [] : fresh);
    if (openAlert) renderAlert(false);
    if (!firstLoad && fresh.length) chime();

    // Mission Control pressed Reset: go back to the log-on screen.
    const resetAt = state.resetAt ? String(state.resetAt) : "";
    if (resetAt !== (store.get(RESET_KEY) || "")) {
      store.set(RESET_KEY, resetAt);
      store.remove(LOGGED_ON_KEY);
      showLogon();
    }

    if (state.warped && !warped) playEnding(firstLoad);
    if (!state.warped && warped) hideEnding();
    warped = !!state.warped;
    firstLoad = false;
  }, (connected) => {
    $("status").textContent = (GameState.isDemo ? "Demo mode · " : "") + (connected ? "● Live" : "○ Reconnecting…");
  }).catch((err) => {
    $("status").textContent = "⚠ " + err.message;
  });
</script>
</body>
</html>
