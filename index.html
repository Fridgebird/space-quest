<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b2a1f; --bg2: #123d2c; --gold: #f5c84c; --red: #c8312f;
    --cream: #fff8e7; --locked: #24473a; --text: #fff8e7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif; color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%) fixed;
    min-height: 100vh; overflow-x: hidden;
  }
  .snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .flake { position: absolute; top: -10px; color: #fff; opacity: .8; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    font-family: "Mountains of Christmas", cursive; color: var(--gold);
    font-size: clamp(2.2rem, 7vw, 4rem); text-align: center; margin: 8px 0 16px;
    text-shadow: 0 3px 0 #7a1d1b, 0 0 24px rgba(245,200,76,.35);
  }
  .card { background: rgba(255,255,255,.07); border: 2px solid rgba(245,200,76,.4); border-radius: 20px; padding: 24px; }
  .intro p { font-size: 1.2rem; line-height: 1.6; margin: 0 0 14px; }
  .btn {
    display: block; margin: 20px auto 0; font: inherit; font-weight: 700; font-size: 1.4rem;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--red); color: #fff; box-shadow: 0 5px 0 #7a1d1b;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a1d1b; }

  .progress { text-align: center; font-size: 1.2rem; margin-bottom: 16px; }
  .bar { height: 14px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--gold)); transition: width .8s ease; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 480px) { .grid { gap: 10px; } }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: 18px; border: 3px solid transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; color: inherit; padding: 8px; user-select: none;
  }
  .tile .sym { font-size: clamp(2.6rem, 11vw, 5rem); line-height: 1; }
  .tile .name { margin-top: 8px; font-weight: 700; font-size: clamp(.8rem, 2.6vw, 1.1rem); text-align: center; }
  .tile.locked { background: var(--locked); cursor: not-allowed; }
  .tile.locked .sym { filter: grayscale(.6) brightness(.8); opacity: .75; }
  .tile.locked .name { opacity: .6; }
  .tile.locked::after { content: "🔒"; position: absolute; top: 8px; right: 10px; font-size: 1.2rem; }
  .tile.open {
    background: linear-gradient(160deg, #fff4cf, var(--gold)); color: #4a1210; cursor: pointer;
    border-color: #fff; box-shadow: 0 0 22px rgba(245,200,76,.7);
  }
  .tile.open:hover { transform: translateY(-3px); }
  .tile.seen { background: linear-gradient(160deg, #e9f3ec, #b9d9c4); color: #123d2c; box-shadow: none; }
  .tile.seen::after { content: "✔"; position: absolute; top: 6px; right: 10px; font-size: 1.2rem; }
  .tile.just { animation: pop 1.2s ease; }
  @keyframes pop {
    0% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-4deg); }
    60% { transform: scale(.96) rotate(3deg); } 100% { transform: scale(1); }
  }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.show { display: flex; }
  .modal .box { background: var(--cream); color: #3a1210; border-radius: 22px; padding: 28px; max-width: 520px; width: 100%; text-align: center; border: 4px solid var(--gold); }
  .modal .sym { font-size: 4rem; }
  .modal h2 { font-family: "Mountains of Christmas", cursive; font-size: 2.2rem; margin: 6px 0 12px; color: var(--red); }
  .modal .content { font-size: 1.3rem; line-height: 1.5; }

  .banner { display: none; text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--gold); margin-top: 24px; }
  .banner.show { display: block; }
  .status { position: fixed; bottom: 8px; right: 12px; font-size: .75rem; opacity: .55; z-index: 2; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<main>
  <h1 id="title"></h1>

  <section id="intro" class="card intro hidden">
    <div id="introText"></div>
    <button class="btn" id="startBtn">Start the quest!</button>
  </section>

  <section id="game" class="hidden">
    <div class="progress"><span id="count"></span><div class="bar"><div id="barFill"></div></div></div>
    <div class="grid" id="grid"></div>
    <div class="banner" id="finale"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="box">
    <div class="sym" id="mSym"></div>
    <h2 id="mTitle"></h2>
    <div class="content" id="mContent"></div>
    <button class="btn" id="mClose">Close</button>
  </div>
</div>
<div class="status" id="status">Connecting…</div>

<script src="config.js"></script>
<script src="state.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const STARTED_KEY = "xmas-started:" + GAME_ID;
  const SEEN_KEY = "xmas-seen:" + GAME_ID;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let seen = new Set(JSON.parse(store.get(SEEN_KEY) || "[]"));
  let unlocked = {};
  let firstLoad = true;
  let audio = null;

  $("title").textContent = GAME.title;
  $("introText").innerHTML = GAME.intro.map((p) => "<p>" + p + "</p>").join("");
  $("finale").textContent = GAME.finale;

  // Snow
  for (let i = 0; i < 30; i++) {
    const f = document.createElement("div");
    f.className = "flake"; f.textContent = "❄";
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = 8 + Math.random() * 14 + "px";
    f.style.animationDuration = 8 + Math.random() * 12 + "s";
    f.style.animationDelay = -Math.random() * 20 + "s";
    $("snow").appendChild(f);
  }

  // Build tiles
  const tileEls = {};
  TILES.forEach((t) => {
    const b = document.createElement("button");
    b.className = "tile locked";
    b.innerHTML = '<div class="sym">' + t.symbol + '</div><div class="name">' + t.title + "</div>";
    b.addEventListener("click", () => openTile(t));
    $("grid").appendChild(b);
    tileEls[t.id] = b;
  });

  function showGame() {
    $("intro").classList.add("hidden");
    $("game").classList.remove("hidden");
  }
  if (store.get(STARTED_KEY)) showGame(); else $("intro").classList.remove("hidden");
  $("startBtn").addEventListener("click", () => {
    store.set(STARTED_KEY, "1");
    initAudio();
    showGame();
  });
  // Audio needs a tap before it can play, so unlock it on the first touch anywhere.
  document.addEventListener("pointerdown", initAudio, { once: true });

  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function chime() {
    if (!audio) return;
    [784, 988, 1175, 1568].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      const t0 = audio.currentTime + i * 0.12;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.65);
    });
  }

  function openTile(t) {
    if (!unlocked[t.id]) return;
    seen.add(t.id);
    store.set(SEEN_KEY, JSON.stringify([...seen]));
    render();
    $("mSym").textContent = t.symbol;
    $("mTitle").textContent = t.title;
    $("mContent").innerHTML = t.reveal;
    $("modal").classList.add("show");
  }
  $("mClose").addEventListener("click", () => $("modal").classList.remove("show"));
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("show"); });

  function render(newlyUnlocked = []) {
    let n = 0;
    TILES.forEach((t) => {
      const el = tileEls[t.id];
      const isOpen = !!unlocked[t.id];
      if (isOpen) n++;
      el.classList.toggle("locked", !isOpen);
      el.classList.toggle("open", isOpen);
      el.classList.toggle("seen", isOpen && seen.has(t.id));
      if (newlyUnlocked.includes(t.id)) {
        el.classList.remove("just"); void el.offsetWidth; el.classList.add("just");
      }
    });
    $("count").textContent = n + " of " + TILES.length + " tiles unlocked";
    $("barFill").style.width = (100 * n / TILES.length) + "%";
    $("finale").classList.toggle("show", n === TILES.length);
  }

  GameState.subscribe((state) => {
    const fresh = Object.keys(state).filter((id) => state[id] && !unlocked[id]);
    // Forget "seen" ticks for tiles that were re-locked (e.g. after a reset).
    seen = new Set([...seen].filter((id) => state[id]));
    store.set(SEEN_KEY, JSON.stringify([...seen]));
    unlocked = state;
    render(firstLoad ? [] : fresh);
    if (!firstLoad && fresh.length) chime();
    firstLoad = false;
  }, (connected) => {
    $("status").textContent = (GameState.isDemo ? "Demo mode · " : "") + (connected ? "● Live" : "○ Reconnecting…");
  }).catch((err) => {
    $("status").textContent = "⚠ " + err.message;
  });
</script>
</body>
</html>
