<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #05060f; --bg2: #1a1145; --cyan: #5ee7ff; --violet: #9b5cff;
    --panel: #151a3a; --pale: #eef4ff; --locked: #171b38; --text: #eef4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Exo 2", system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(ellipse at 15% 10%, rgba(155,92,255,.35), transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(94,231,255,.18), transparent 50%),
      linear-gradient(var(--bg2), var(--bg1) 70%) fixed;
    background-attachment: fixed;
    min-height: 100vh; overflow-x: hidden;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }

  main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    font-family: "Orbitron", sans-serif; color: var(--cyan); letter-spacing: .04em;
    font-size: clamp(1.8rem, 6vw, 3.4rem); text-align: center; margin: 8px 0 20px;
    text-shadow: 0 0 22px rgba(94,231,255,.6);
  }
  .card { background: rgba(21,26,58,.75); border: 2px solid rgba(94,231,255,.4); border-radius: 20px; padding: 24px; }
  .intro p { font-size: 1.2rem; line-height: 1.6; margin: 0 0 14px; }
  .btn {
    display: block; margin: 20px auto 0; font: inherit; font-weight: 700; font-size: 1.3rem;
    padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--violet); color: #fff; box-shadow: 0 5px 0 #5a2ca8;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a2ca8; }

  .progress { text-align: center; font-size: 1.2rem; margin-bottom: 16px; }
  .bar { height: 14px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width .8s ease; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 480px) { .grid { gap: 10px; } }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: 18px; border: 2px solid rgba(94,231,255,.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; color: inherit; padding: 8px; user-select: none;
  }
  .tile .sym { font-size: clamp(2.6rem, 11vw, 5rem); line-height: 1; }
  .tile .name { margin-top: 8px; font-weight: 700; font-size: clamp(.8rem, 2.6vw, 1.1rem); text-align: center; }
  .tile.locked { background: var(--locked); cursor: not-allowed; }
  .tile.locked .sym { filter: grayscale(.7) brightness(.75); opacity: .75; }
  .tile.locked .name { opacity: .6; }
  .tile.locked::after { content: "🔒"; position: absolute; top: 8px; right: 10px; font-size: 1.2rem; }
  .tile.open {
    background: linear-gradient(160deg, #2b1f7a, #0f6f8f); cursor: pointer;
    border-color: var(--cyan); box-shadow: 0 0 22px rgba(94,231,255,.7);
  }
  .tile.open:hover { transform: translateY(-3px); }
  .tile.seen { background: var(--panel); border-color: rgba(94,231,255,.5); box-shadow: none; }
  .tile.seen::after { content: "✔"; position: absolute; top: 6px; right: 10px; font-size: 1.2rem; color: var(--cyan); }
  .tile.just { animation: pop 1.2s ease; }
  @keyframes pop {
    0% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-4deg); }
    60% { transform: scale(.96) rotate(3deg); } 100% { transform: scale(1); }
  }

  .modal { position: fixed; inset: 0; background: rgba(2,3,12,.75); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.show { display: flex; }
  .modal .box { background: var(--panel); color: var(--pale); border-radius: 22px; padding: 28px; max-width: 520px; width: 100%; text-align: center; border: 2px solid var(--cyan); box-shadow: 0 0 40px rgba(94,231,255,.4); }
  .modal .sym { font-size: 4rem; }
  .modal h2 { font-family: "Orbitron", sans-serif; font-size: 1.7rem; margin: 6px 0 12px; color: var(--cyan); }
  .modal .content { font-size: 1.3rem; line-height: 1.5; }

  .banner { display: none; text-align: center; font-size: 1.5rem; font-weight: 700; color: var(--cyan); margin-top: 24px; }
  .banner.show { display: block; }
  .status { position: fixed; bottom: 8px; right: 12px; font-size: .75rem; opacity: .6; z-index: 2; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<main>
  <h1 id="title"></h1>

  <section id="intro" class="card intro hidden">
    <div id="introText"></div>
    <button class="btn" id="startBtn">Begin mission</button>
  </section>

  <section id="game" class="hidden">
    <div class="progress"><span id="count"></span><div class="bar"><div id="barFill"></div></div></div>
    <div class="grid" id="grid"></div>
    <div class="banner" id="finale"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="box">
    <div class="sym" id="mSym"></div>
    <h2 id="mTitle"></h2>
    <div class="content" id="mContent"></div>
    <button class="btn" id="mClose">Close</button>
  </div>
</div>
<div class="status" id="status">Connecting…</div>

<script src="config.js"></script>
<script src="state.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const STARTED_KEY = "quest-started:" + GAME_ID;
  const SEEN_KEY = "quest-seen:" + GAME_ID;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let seen = new Set(JSON.parse(store.get(SEEN_KEY) || "[]"));
  let unlocked = {};
  let firstLoad = true;
  let audio = null;

  $("title").textContent = GAME.title;
  $("introText").innerHTML = GAME.intro.map((p) => "<p>" + p + "</p>").join("");
  $("finale").textContent = GAME.finale;

  // Stars
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    const size = 1 + Math.random() * 2.5;
    s.className = "star";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.width = s.style.height = size + "px";
    s.style.animationDuration = 1.5 + Math.random() * 4 + "s";
    s.style.animationDelay = -Math.random() * 5 + "s";
    $("stars").appendChild(s);
  }

  // Build tiles
  const tileEls = {};
  TILES.forEach((t) => {
    const b = document.createElement("button");
    b.className = "tile locked";
    b.innerHTML = '<div class="sym">' + t.symbol + '</div><div class="name">' + t.title + "</div>";
    b.addEventListener("click", () => openTile(t));
    $("grid").appendChild(b);
    tileEls[t.id] = b;
  });

  function showGame() {
    $("intro").classList.add("hidden");
    $("game").classList.remove("hidden");
  }
  if (store.get(STARTED_KEY)) showGame(); else $("intro").classList.remove("hidden");
  $("startBtn").addEventListener("click", () => {
    store.set(STARTED_KEY, "1");
    initAudio();
    showGame();
  });
  // Audio needs a tap before it can play, so unlock it on the first touch anywhere.
  document.addEventListener("pointerdown", initAudio, { once: true });

  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function chime() {
    if (!audio) return;
    [523, 784, 1047, 1568].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      const t0 = audio.currentTime + i * 0.1;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.55);
    });
  }

  function openTile(t) {
    if (!unlocked[t.id]) return;
    seen.add(t.id);
    store.set(SEEN_KEY, JSON.stringify([...seen]));
    render();
    $("mSym").textContent = t.symbol;
    $("mTitle").textContent = t.title;
    $("mContent").innerHTML = t.reveal;
    $("modal").classList.add("show");
  }
  $("mClose").addEventListener("click", () => $("modal").classList.remove("show"));
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("show"); });

  function render(newlyUnlocked = []) {
    let n = 0;
    TILES.forEach((t) => {
      const el = tileEls[t.id];
      const isOpen = !!unlocked[t.id];
      if (isOpen) n++;
      el.classList.toggle("locked", !isOpen);
      el.classList.toggle("open", isOpen);
      el.classList.toggle("seen", isOpen && seen.has(t.id));
      if (newlyUnlocked.includes(t.id)) {
        el.classList.remove("just"); void el.offsetWidth; el.classList.add("just");
      }
    });
    $("count").textContent = n + " of " + TILES.length + " tiles unlocked";
    $("barFill").style.width = (100 * n / TILES.length) + "%";
    $("finale").classList.toggle("show", n === TILES.length);
  }

  GameState.subscribe((state) => {
    const fresh = Object.keys(state).filter((id) => state[id] && !unlocked[id]);
    // Forget "seen" ticks for tiles that were re-locked (e.g. after a reset).
    seen = new Set([...seen].filter((id) => state[id]));
    store.set(SEEN_KEY, JSON.stringify([...seen]));
    unlocked = state;
    render(firstLoad ? [] : fresh);
    if (!firstLoad && fresh.length) chime();
    firstLoad = false;
  }, (connected) => {
    $("status").textContent = (GameState.isDemo ? "Demo mode · " : "") + (connected ? "● Live" : "○ Reconnecting…");
  }).catch((err) => {
    $("status").textContent = "⚠ " + err.message;
  });
</script>
</body>
</html>
