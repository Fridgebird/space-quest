<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mission Control</title>
<style>
  :root { --bg: #0a0c1f; --card: #171b38; --cyan: #5ee7ff; --red: #ff4d5e; --green: #4be3a0; --text: #eef4ff; --muted: #a3acd0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 4px 0 4px; color: var(--cyan); }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .row {
    display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px;
    padding: 10px 12px; margin-bottom: 8px; border-left: 4px solid var(--red);
  }
  .row.done { border-left-color: var(--green); }
  .row .sym { font-size: 2rem; width: 2.4rem; text-align: center; }
  .row .info { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; }
  .row .r { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
  .toggle {
    font: inherit; font-weight: 700; min-width: 96px; min-height: 48px; padding: 10px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--red); color: #fff;
  }
  .toggle.on { background: #2d3358; color: var(--text); }
  .warp { background: var(--card); border-radius: 14px; padding: 14px; margin: 16px 0 0; text-align: center; font-weight: 700; color: var(--muted); }
  .warp.on { color: var(--cyan); }
  .reset { margin-top: 16px; width: 100%; min-height: 48px; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid #4a5280; background: none; color: var(--muted); cursor: pointer; }
  .denied { text-align: center; margin-top: 30vh; color: var(--muted); }
  .status { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>

<script src="config.js"></script>
<script src="state.js"></script>
<script>
  const app = document.getElementById("app");
  const key = new URLSearchParams(location.search).get("key");

  if (key !== ADMIN_KEY) {
    app.innerHTML = '<p class="denied">Nothing to see here 👽</p>';
  } else {
    app.innerHTML =
      "<h1>🛰️ Mission Control</h1>" +
      '<div class="sub"><span id="count"></span> · <span class="status" id="status">Connecting…</span></div>' +
      '<div id="list"></div>' +
      '<div class="warp" id="warp"></div>' +
      '<button class="reset" id="reset">Reset game (raise all alerts, back to log-on)</button>';

    let cleared = {};
    const rows = {};

    ALERTS.forEach((a) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="sym"></div>' +
        '<div class="info"><div class="t"></div><div class="r"></div></div>' +
        '<button class="toggle"></button>';
      row.querySelector(".sym").textContent = a.symbol;
      row.querySelector(".t").textContent = a.title;
      row.querySelector(".r").textContent = a.code ? "Crew enter code: " + a.code : "You clear this one";
      const btn = row.querySelector(".toggle");
      btn.addEventListener("click", () => {
        const clear = !cleared[a.id];
        if (!clear && !confirm("Raise \"" + a.title + "\" again?")) return;
        GameState.setCleared(a.id, clear);
      });
      rows[a.id] = { row, btn };
      document.getElementById("list").appendChild(row);
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (confirm("Reset the whole game and send the tablet back to the log-on screen?")) GameState.reset();
    });

    GameState.subscribe((state) => {
      cleared = state.cleared;
      let n = 0;
      ALERTS.forEach((a) => {
        const on = !!cleared[a.id];
        if (on) n++;
        rows[a.id].row.classList.toggle("done", on);
        rows[a.id].btn.classList.toggle("on", on);
        rows[a.id].btn.textContent = on ? "Cleared" : "Clear";
      });
      document.getElementById("count").textContent = n + "/" + ALERTS.length + " alerts cleared";
      const warp = document.getElementById("warp");
      warp.classList.toggle("on", state.warped || n === ALERTS.length);
      warp.textContent = state.warped ? "🚀 Warp engaged: game complete"
        : n === ALERTS.length ? "Warp button is live on the tablet"
        : "Warp offline until all alerts are cleared";
    }, (connected) => {
      document.getElementById("status").textContent = (GameState.isDemo ? "Demo mode · " : "") + (connected ? "● Live" : "○ Reconnecting…");
    }).catch((err) => {
      document.getElementById("status").textContent = "⚠ " + err.message;
    });
  }
</script>
</body>
</html>
